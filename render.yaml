services:
  - type: web
    name: coupon-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx index.ts
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: PORT
        value: "4000"
